name: Home prompt teaser v3
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/home-prompt-teaser-v3.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="./assets/css/home-prompt-teaser.css?v=1">'
          if css not in s:
              s=s.replace('<link rel="stylesheet" href="./assets/css/photo-editor.css?v=split2">','<link rel="stylesheet" href="./assets/css/photo-editor.css?v=split2">\n'+css,1)
          if 'id="funPrompts"' not in s:
              marker='\n  <section class="why-v3">'
              frag=Path('assets/fragments/home-prompt-teaser.html').read_text(encoding='utf-8')
              if marker not in s:
                  raise SystemExit('marker not found')
              s=s.replace(marker,'\n'+frag+marker,1)
          script='<script src="./assets/js/home-prompt-teaser.js?v=1"></script>'
          if script not in s:
              s=s.replace('</body>',script+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          for wf in ['home-prompt-teaser-v1.yml','home-prompt-teaser-v2.yml','home-prompt-teaser-v3.yml']:
              q=Path('.github/workflows')/wf
              if q.exists(): q.unlink()
          PY
          git config user.name "njobdaddy"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add home fun prompt teaser"
          git push origin HEAD:main
