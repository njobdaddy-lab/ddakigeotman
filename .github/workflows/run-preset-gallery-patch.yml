name: Run preset gallery patch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-preset-gallery-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python tools/patch_preset_gallery.py
      - name: Commit changes
        run: |
          rm -f .github/workflows/run-preset-gallery-patch.yml
          git config user.name "njobdaddy"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add preset prompt gallery"
          git push origin HEAD:main
