name: Apply homepage redesign

on:
  push:
    paths:
      - 'scripts/redesign_home.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply homepage redesign
        run: python scripts/redesign_home.py
      - name: Commit updated site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Redesign 딱이것만 homepage'
          git push
