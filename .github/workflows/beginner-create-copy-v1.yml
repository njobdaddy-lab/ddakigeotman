name: Beginner create copy v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/beginner-create-copy-v1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply beginner-friendly copy and examples
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          old = "    <h2>무엇을 만들고 싶나요?</h2>\n    <div class=\"desc\">원하는 내용을 편하게 적어주세요. 전문적인 표현은 몰라도 괜찮아요.</div>\n    <textarea id=\"createCore\" class=\"wide textarea\" placeholder=\"예) SKT매장 외부홍보용 VMD 아이폰17 기기가격 20만원 공시지원금, 카드사용조건\"></textarea>"
          new = "\n".join([
              '    <h2>원하는 걸 편하게 적어주세요.</h2>',
              '    <div class="desc">짧게, 반말로, 생각나는 대로 적어도 괜찮아요. 작업 설명과 실제 요청은 내말대로가 정리해드려요.</div>',
              '    <textarea id="createCore" class="wide textarea" placeholder="예) 갤럭시 S26 행사 이미지 만들고 싶어&#10;단골 1400명 기념이고 기계가격 1,000원 강조&#10;매장 앞에 붙일 거라 눈에 잘 띄고 고급스럽게"></textarea>',
              '    <div class="field create-example-field">',
              '      <div class="label">어떻게 적을지 막막하면 예시부터 눌러보세요.</div>',
              '      <div class="choice create-example-choices">',
              '        <button type="button" onclick="fillCreateExample(\'product\')">제품 홍보 예시</button>',
              '        <button type="button" onclick="fillCreateExample(\'poster\')">포스터 예시</button>',
              '        <button type="button" onclick="fillCreateExample(\'sns\')">SNS 이미지 예시</button>',
              '      </div>',
              '      <div class="hint">예시는 입력칸에만 채워져요. 그대로 써도 되고 내 상황에 맞게 대충 고쳐도 괜찮아요.</div>',
              '    </div>'
          ])
          if old not in html:
              raise SystemExit('create intro pattern not found')
          html = html.replace(old, new, 1)
          html = html.replace('./assets/js/app.js?v=split4','./assets/js/app.js?v=split5',1)
          index.write_text(html, encoding='utf-8')
          app = Path('assets/js/app.js')
          js = app.read_text(encoding='utf-8')
          marker = 'function makeCreatePrompt(){'
          if marker not in js:
              raise SystemExit('makeCreatePrompt marker not found')
          helper = "\n".join([
              'function fillCreateExample(type){',
              '  const examples={',
              "    product:'갤럭시 S26 행사 이미지 만들고 싶어. 단골 1400명 돌파 기념이고 공시지원금, 제휴카드 사용조건으로 기계가격 1,000원을 가장 잘 보이게 하고 싶어. 매장 앞에 붙일 거라 고급스럽고 눈에 잘 띄게.',",
              "    poster:'카페 여름 신메뉴 포스터 만들고 싶어. 망고빙수 8,900원 강조하고 시원하고 깔끔한 느낌. 매장 유리창에 붙일 거라 멀리서도 가격이 잘 보였으면 좋겠어.',",
              "    sns:'인스타에 올릴 이벤트 이미지 만들고 싶어. 이번 주말만 20% 할인, 기간은 8월 29일부터 30일까지. 너무 광고 같지는 않고 밝고 세련되게.'",
              '  };',
              "  const box=document.getElementById('createCore');",
              '  if(!box||!examples[type])return;',
              '  box.value=examples[type];',
              '  box.focus();',
              '  box.setSelectionRange(box.value.length,box.value.length);',
              '}',
              ''
          ])
          if 'function fillCreateExample(type)' not in js:
              js = js.replace(marker, helper + marker, 1)
          app.write_text(js, encoding='utf-8')
          PY
          rm .github/workflows/beginner-create-copy-v1.yml
          git config user.name "njobdaddy"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Make create form beginner friendly"
          git push origin HEAD:main
