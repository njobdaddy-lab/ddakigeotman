name: Publish current prototype

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild current HTML
        shell: bash
        run: |
          cat > /tmp/site.html.xz.b64 <<'EOF_DDAK'

EOF_DDAK
          base64 -d /tmp/site.html.xz.b64 | xz -d > index.html
          grep -q '딱이것만' index.html
          grep -q 'V1.9' index.html
          test "$(sha256sum index.html | awk '{print $1}')" = "1daa582e79ee2790fd4f7df4935607b3a21dd8f61fcb80788314bd8e23923f9f"
      - name: Commit index.html
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Publish 딱이것만 V1.9'
          git push
