name: Publish current prototype

on:
  push:
    paths:
      - '.github/workflows/sync-site.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download current HTML
        run: |
          curl -L --fail --retry 3 'https://drive.google.com/uc?export=download&id=1zgRxqgkODsjspJJwcUBNzSYzfeVDdrBC' -o index.html
          grep -qi '<!DOCTYPE html' index.html
      - name: Commit index.html
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Publish 딱이것만 V1.9'
          git push
