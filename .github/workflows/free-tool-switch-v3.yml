name: Free tool switch v3

on:
  push:
    branches: [free-tool-switch-v1]
    paths:
      - '.github/workflows/free-tool-switch-v3.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: free-tool-switch-v1
      - name: Apply Hero partial edit CTA and module switcher
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('assets/js/app.js')
          js = app.read_text(encoding='utf-8')

          # 1) Add a history-clean switch helper next to the existing module router.
          old_route = "function openModule(name){if(MODULE_NAMES.has(name))pushScreen('module-'+name)}\n"
          if old_route not in js:
              raise SystemExit('openModule pattern not found')
          route_lines = [
              "function openModule(name){if(MODULE_NAMES.has(name))pushScreen('module-'+name)}",
              "function switchFreeTool(name){",
              "  if(!MODULE_NAMES.has(name))return;",
              "  const screen='module-'+name;",
              "  if(screen===currentScreen)return;",
              "  if(fallbackStack.length)fallbackStack[fallbackStack.length-1]=screen;else fallbackStack=[screen];",
              "  try{history.replaceState({nmdScreen:screen},'',location.href.split('#')[0])}catch(e){}",
              "  renderScreen(screen)",
              "}",
              ""
          ]
          js = js.replace(old_route, "\n".join(route_lines), 1)

          # 2) Inject a two-way switcher into create/photo modules.
          stitch_marker = "function applyStitchHomeStage1(){"
          if stitch_marker not in js:
              raise SystemExit('Stitch function marker not found')
          setup_lines = [
              "function setupFreeToolSwitchers(){",
              "  const tools=[['module-create','create'],['module-photo','photo']];",
              "  tools.forEach(([id,active])=>{",
              "    const module=document.getElementById(id);",
              "    if(!module||module.querySelector('.free-tool-switcher'))return;",
              "    const head=module.querySelector('.module-head');",
              "    if(!head)return;",
              "    const nav=document.createElement('div');",
              "    nav.className='free-tool-switcher';",
              "    nav.setAttribute('aria-label','무료 도구 전환');",
              "    [['create','새 이미지 요청문'],['photo','이미지 부분수정']].forEach(([name,label])=>{",
              "      const btn=document.createElement('button');",
              "      btn.type='button';",
              "      btn.textContent=label;",
              "      btn.classList.toggle('active',name===active);",
              "      btn.addEventListener('click',()=>switchFreeTool(name));",
              "      nav.appendChild(btn);",
              "    });",
              "    head.insertAdjacentElement('afterend',nav);",
              "  });",
              "}",
              ""
          ]
          js = js.replace(stitch_marker, "\n".join(setup_lines) + stitch_marker, 1)

          # 3) Hero currently demonstrates partial editing. Patch only its primary CTA segment.
          pos = js.find('nmd-hero-primary')
          if pos < 0:
              raise SystemExit('Hero primary button marker not found')
          start = max(0, pos - 120)
          end = min(len(js), pos + 320)
          segment = js[start:end]
          if "openModule('create')" not in segment:
              raise SystemExit('Hero create route not found near primary button')
          if '무료로 시작하기' not in segment:
              raise SystemExit('Hero CTA label not found near primary button')
          segment = segment.replace("openModule('create')", "openModule('photo')", 1)
          segment = segment.replace('무료로 시작하기', '이미지 부분수정 시작하기', 1)
          js = js[:start] + segment + js[end:]

          # 4) Build the free-tool switchers before applying the Stitch home shell.
          init_pos = js.rfind('applyStitchHomeStage1();')
          if init_pos < 0:
              raise SystemExit('Stitch init call not found')
          js = js[:init_pos] + 'setupFreeToolSwitchers();\n' + js[init_pos:]
          app.write_text(js, encoding='utf-8')

          # 5) Switcher styling only; photo editor styles remain untouched.
          css_path = Path('assets/css/site.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* nmd-free-tool-switcher-v1 */'
          if marker not in css:
              css += """

/* nmd-free-tool-switcher-v1 */
.free-tool-switcher{
  display:grid;grid-template-columns:1fr 1fr;gap:6px;
  margin:12px 0 16px;padding:5px;
  background:#f3f0e9;border:1px solid var(--line);border-radius:14px;
}
.free-tool-switcher button{
  min-height:44px;border:0;background:transparent;border-radius:10px;
  color:#66707e;font-weight:900;font-size:12px;cursor:pointer;
}
.free-tool-switcher button.active{
  background:var(--deep);color:#fff;box-shadow:0 5px 14px rgba(7,27,59,.12);
}
@media(max-width:680px){
  .free-tool-switcher{margin:10px 0 14px;padding:4px;border-radius:12px}
  .free-tool-switcher button{min-height:42px;font-size:11px}
}
"""
              css_path.write_text(css, encoding='utf-8')

          # 6) Cache-bust only the files changed in this patch.
          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          html = html.replace('./assets/css/site.css?v=split1','./assets/css/site.css?v=split4',1)
          html = html.replace('./assets/js/app.js?v=split1','./assets/js/app.js?v=split4',1)
          index.write_text(html, encoding='utf-8')
          PY

          rm -f .github/workflows/free-tool-switch-v1.yml .github/workflows/free-tool-switch-v2.yml .github/workflows/free-tool-switch-v3.yml
          git config user.name "njobdaddy"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Link Hero example to partial edit and add free tool switcher"
          git push origin HEAD:free-tool-switch-v1
