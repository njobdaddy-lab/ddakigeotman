name: Mobile workshop spacing fix

on:
  push:
    branches: [mobile-workshop-spacing]
    paths:
      - '.github/workflows/mobile-workshop-spacing.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-workshop-spacing
      - name: Apply mobile spacing only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('assets/css/site.css')
          css = p.read_text(encoding='utf-8')
          marker = '/* nmd-mobile-workshop-spacing-v1 */'
          if marker not in css:
              css += '''\n\n/* nmd-mobile-workshop-spacing-v1 */\n@media(max-width:680px){\n  .workshop{padding:20px 18px 18px}\n  .workshop .section-label{margin-bottom:9px}\n  .workshop p{margin-top:10px}\n  .workshop button{margin-top:20px}\n  .workshop-grid{margin-top:22px}\n  .final-cta{margin-top:32px;padding:22px 18px;gap:20px}\n  .final-cta p{margin-top:9px}\n}\n'''
              p.write_text(css, encoding='utf-8')
          PY

          rm .github/workflows/mobile-workshop-spacing.yml
          git config user.name "njobdaddy"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Tune mobile workshop spacing"
          git push origin HEAD:mobile-workshop-spacing
