name: Apply homepage examples

on:
  push:
    paths:
      - '.site/apply-examples.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish example assets
        shell: bash
        run: |
          mkdir -p assets/examples
          cp .site/example-edit.svg assets/examples/example-edit.svg
          cp .site/example-poster.svg assets/examples/example-poster.svg
          cp .site/example-restore.svg assets/examples/example-restore.svg
          cp .site/example-video.svg assets/examples/example-video.svg
      - name: Fix homepage example paths
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          text = text.replace('./.site/example-edit.svg?v=nmd6', './assets/examples/example-edit.svg?v=nmd7')
          text = text.replace('./.site/example-poster.svg?v=nmd6', './assets/examples/example-poster.svg?v=nmd7')
          text = text.replace('./.site/example-restore.svg?v=nmd6', './assets/examples/example-restore.svg?v=nmd7')
          text = text.replace('./.site/example-video.svg?v=nmd6', './assets/examples/example-video.svg?v=nmd7')
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit homepage and assets
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/examples
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Serve homepage example images from public assets'
          git push
