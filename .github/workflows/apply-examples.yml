name: Apply homepage examples

on:
  push:
    paths:
      - '.site/apply-examples.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add example image loader
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = '<!-- EXAMPLE_IMAGE_LOADER_V1 -->'
          loader = r'''<!-- EXAMPLE_IMAGE_LOADER_V1 -->
          <script>
          (async()=>{
            try{
              const files=['./.site/exjs.part01','./.site/exjs.part02','./.site/exjs.part03','./.site/exjs.part04'];
              const parts=await Promise.all(files.map(async p=>{const r=await fetch(p+'?v=examples1',{cache:'no-store'});if(!r.ok)throw new Error(p+' '+r.status);return r.text();}));
              const s=document.createElement('script');
              s.textContent=parts.join('');
              document.body.appendChild(s);
            }catch(e){console.error('homepage examples failed',e);}
          })();
          </script>'''
          if marker not in text:
              if '</body>' not in text:
                  raise SystemExit('body closing tag not found')
              text = text.replace('</body>', loader + '\n</body>', 1)
              p.write_text(text, encoding='utf-8')
          PY
      - name: Commit homepage
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Apply generated homepage examples'
          git push
