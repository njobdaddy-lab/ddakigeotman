name: Home prompt teaser v2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/home-prompt-teaser-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
          git config user.name "njobdaddy"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add home fun prompt teaser"
          git push origin HEAD:main
