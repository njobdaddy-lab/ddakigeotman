name: Hero cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply Hero cleanup
        run: python3 scripts/hero_cleanup.py
      - name: Commit Hero cleanup
        run: |
          git config user.name "njobdaddy"
          git config user.email "actions@users.noreply.github.com"
          git add assets/js/app.js assets/css/home-stitch.css
          git rm .github/workflows/hero-fix.yml scripts/hero_cleanup.py
          git commit -m "Use direct v2 Hero images"
          git push origin HEAD:main
